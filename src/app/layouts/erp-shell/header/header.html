<header class="erp-header">
  <div class="header-left">
    <button type="button" class="hamburger" aria-label="Toggle sidebar" (click)="toggleSidebar()">
      <i class="pi pi-bars"></i>
    </button>
  </div>

  <div class="header-right">
    <label class="search-box">
      <i class="pi pi-search"></i>
      <input type="search" placeholder="Search..." />
    </label>

    <button class="icon-btn notification" type="button" aria-label="Notifications">
      <i class="pi pi-bell"></i>
      <span></span>
    </button>

    <div class="module-dropdown">
      <button type="button" class="module-btn" (click)="moduleMenuOpen = !moduleMenuOpen; userMenuOpen = false">
        <i class="pi pi-th-large"></i>
        <span>Modules</span>
        <i class="pi pi-angle-down"></i>
      </button>
      <div class="dropdown-card module-menu" *ngIf="moduleMenuOpen">
        <button type="button" *ngFor="let module of modules" (click)="goModule(module)">
          <i [class]="module.icon || 'pi pi-folder'"></i>
          <span>{{ module.title }}</span>
        </button>
      </div>
    </div>


    <div class="user-dropdown">
      <button type="button" class="user-btn" (click)="userMenuOpen = !userMenuOpen; moduleMenuOpen = false">
        <span class="avatar">{{ avatarText }}</span>
        <span class="user-meta">
          <strong>{{ displayName }}</strong>
          <small>{{ companyName }} <em>({{ areaName }})</em></small>
        </span>
        <i class="pi pi-angle-down"></i>
      </button>

      <div class="dropdown-card user-menu" *ngIf="userMenuOpen">
        <div class="user-card-head">
          <span class="avatar large">{{ avatarText }}</span>
          <div class="user-card-copy">
            <strong>{{ displayName }}</strong>
            <small>{{ roleName }}</small>
          </div>
        </div>

        <button type="button" (click)="switchCompany()"><i class="pi pi-building"></i> Switch Company</button>
        <button type="button"><i class="pi pi-user"></i> My Profile</button>
        <button type="button"><i class="pi pi-key"></i> Change Password</button>
        <button type="button" class="danger" (click)="logout()"><i class="pi pi-sign-out"></i> Sign Out</button>
      </div>
    </div>
  </div>
</header>
