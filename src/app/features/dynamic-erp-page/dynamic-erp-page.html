<ng-container *ngIf="loading; else loadedPage">
  <section class="dynamic-page-card">
    <div class="dynamic-icon"><i class="pi pi-spin pi-spinner"></i></div>
    <div>
      <h1>Loading...</h1>
      <p>Please wait while the ERP page configuration is loading.</p>
    </div>
  </section>
</ng-container>

<ng-template #loadedPage>
  <app-crud-master *ngIf="pageConfig; else genericPage" [config]="pageConfig"></app-crud-master>
</ng-template>

<ng-template #genericPage>
  <section class="dynamic-page-card">
    <div class="dynamic-icon"><i class="pi pi-file-edit"></i></div>
    <div>
      <h1>{{ title }}</h1>
      <p>{{ error || 'This ERP route is valid and ready for a dynamic form/table configuration.' }}</p>
      <code>{{ currentUrl }}</code>
    </div>
  </section>
</ng-template>
