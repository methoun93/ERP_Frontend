<div class="setup-page"><aside class="module-list"><h2>Modules</h2><p>Select a module to set auto-create rules.</p><button *ngFor="let m of modules" class="module-card" [class.active]="selected?.moduleId===m.moduleId" (click)="selectModule(m)"><span class="avatar">{{(m.moduleName||'M').charAt(0)}}</span><span>{{m.moduleName}}</span><small>{{m.enabledProcesses}} enabled</small></button></aside><section class="main-card"><div class="card-title"><div><h2>Process Auto Rules</h2><p>Define what record will be created automatically when a step is skipped.</p></div><div><button (click)="add()">Add Rule</button><button class="primary" (click)="save()" [disabled]="saving||!setup">Save</button></div></div><div *ngIf="error" class="alert error">{{error}}</div><div *ngIf="success" class="alert success">{{success}}</div><table><thead><tr><th>#</th><th>If This Step Is Skipped</th><th>Then Auto Create</th><th>Create As</th><th>Copy Data From</th><th>Active</th><th>Action</th></tr></thead><tbody><tr *ngFor="let r of setup?.autoRules || []; let i=index"><td>{{i+1}}</td><td><select [(ngModel)]="r.skipProcessId"><option *ngFor="let p of enabled()" [ngValue]="p.processId">{{p.processName}}</option></select></td><td><select [(ngModel)]="r.autoCreateProcessId"><option *ngFor="let p of enabled()" [ngValue]="p.processId">{{p.processName}}</option></select></td><td><select [(ngModel)]="r.createAs"><option *ngFor="let o of createAs" [ngValue]="o.value">{{o.label}}</option></select></td><td><select [(ngModel)]="r.copyDataFrom"><option *ngFor="let o of copy" [ngValue]="o.value">{{o.label}}</option></select></td><td><input type="checkbox" [(ngModel)]="r.isActive"></td><td><button class="danger" (click)="remove(i)">Remove</button></td></tr></tbody></table><div class="empty" *ngIf="setup && !(setup.autoRules||[]).length">No auto rule found. Click Add Rule.</div></section></div>
