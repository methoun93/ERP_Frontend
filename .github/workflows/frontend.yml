name: Frontend CI/CD

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

jobs:
  build:
    name: Build Angular Frontend
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Node and npm versions
        shell: powershell
        run: |
          node -v
          npm -v

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Build production bundle
        shell: powershell
        run: npm run build